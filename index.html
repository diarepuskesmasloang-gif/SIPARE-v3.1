<script>
window.addEventListener('error', e => { const x = document.getElementById('lerr'); if (x && !x.textContent) x.textContent = 'Kesalahan skrip: ' + e.message; });
const SS = { get: k => { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} }, del: k => { try { sessionStorage.removeItem(k); } catch (e) {} } };
const $ = i => document.getElementById(i);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Views = {}; let TOKEN = SS.get('sipare_t'), BOOT = null, USERS = [];
const LOGO_SVG = '<svg viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="14" fill="#22B14C"/><path d="M26 14h12v12h12v12H38v12H26V38H14V26h12z" fill="#fff"/><path d="M8 34h14l5-9 7 18 5-9h17" fill="none" stroke="#1E9BFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',3200);}
/* ---------- API + MODE OFFLINE ---------- */
// Batasan: aplikasi Apps Script tidak bisa memakai Service Worker, jadi halaman harus sudah terbuka (dimuat saat online).
// Selama halaman terbuka: data yang pernah dibuka tampil dari salinan di perangkat; Input Data diantre lalu dikirim otomatis.
const NETRE = /(network|failed to fetch|networkerror|load failed|err_internet|err_network|err_connection|err_name_not_resolved|offline)/i;
const MSG_NOCACHE = 'Tidak ada koneksi internet dan data ini belum tersimpan di perangkat. Buka menu ini saat online terlebih dahulu.';
const MSG_NEEDNET = 'Tidak ada koneksi internet. Fitur ini memerlukan koneksi.';
const READ_C = { getView: 1, getMingguList: 1, getDesa: 1, getKalender: 1, getDashboardOptions: 1, getGrafikTrendData: 1, getPasien: 1, getRegister: 1 };
const WRITE_Q = { saveLaporanUmum: 1, saveLaporanWabah: 1 };
const ST = { fail: false, toastT: 0 };
function netErr(m){ const e = new Error(m); e.net = true; return e; }
function isNetErr(e){ return !!(e && (e.net || NETRE.test(String((e && e.message) || '')))); }
// ALAMAT SERVER: tempel link /exec dari Deploy > Manage deployments (Web app URL)
const API_URL = 'https://script.google.com/macros/s/AKfycbwvCxumfpVnoLUfxcH3miGaN5RW9-cEC1y8xJBLnWdST5ki14Qo70pkYF1O6tkq9o4/exec';
function apiT(ms, fn, ...a){
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), ms);
  return fetch(API_URL, { method: 'POST', redirect: 'follow', signal: ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: a }) })
    .then(r => { if (!r.ok) throw netErr('Server menjawab ' + r.status + '.'); return r.json(); })
    .then(j => {
      if (j && j.ok) return j.v;
      const m = String((j && j.e) || 'Terjadi kesalahan di server.');
      if (/SESI_HABIS/.test(m)) { localLogout('Sesi berakhir, silakan login kembali.'); }
      throw new Error(m);
    }, e => {
      if (e && e.net) throw e;
      if (e && e.name === 'AbortError') throw netErr('Server tidak merespons (lebih dari ' + Math.round(ms / 1000) + ' detik). Periksa koneksi lalu coba lagi. Bila tadi sedang menyimpan data, cek hasilnya dahulu sebelum mengulang.');
      throw netErr('Tidak dapat menghubungi server: ' + ((e && e.message) || e));
    })
    .finally(() => clearTimeout(tm));
}
const api = (fn, ...a) => apiT(90000, fn, ...a);

/* penyimpanan di perangkat (localStorage; cadangan memori bila diblokir browser) */
const OFF = (function(){
  const P = 'sipare_off_', mem = {}, VIEW = 'getView|';
  let persist = true;
  try { localStorage.setItem(P + 't', '1'); localStorage.removeItem(P + 't'); } catch (e) { persist = false; }
  function rawGet(k){ try { const v = localStorage.getItem(P + k); if (v != null) return v; } catch (e) {} return k in mem ? mem[k] : null; }
  function rawSet(k, v){ try { localStorage.setItem(P + k, v); delete mem[k]; return true; } catch (e) { mem[k] = v; return false; } }
  function rawDel(k){ try { localStorage.removeItem(P + k); } catch (e) {} delete mem[k]; }
  function idx(){ try { return JSON.parse(rawGet('i') || '{}') || {}; } catch (e) { return {}; } }
  function evict(ix, n){ Object.keys(ix).filter(k => k.indexOf(VIEW) !== 0).sort((a, b) => ix[a] - ix[b]).slice(0, n).forEach(k => { rawDel('c:' + k); delete ix[k]; }); }
  return {
    persist: () => persist,
    get: rawGet, set: rawSet,
    has: key => key in idx(),
    cSet(key, v){ try { const ix = idx(), rec = JSON.stringify({ t: Date.now(), v: v }); if (!rawSet('c:' + key, rec)) { evict(ix, 10); rawSet('c:' + key, rec); } ix[key] = Date.now(); rawSet('i', JSON.stringify(ix)); } catch (e) {} },
    cGet(key){ try { const s = rawGet('c:' + key); if (!s) return null; const r = JSON.parse(s), ttl = key.indexOf(VIEW) === 0 ? 30 * 864e5 : 7 * 864e5; return Date.now() - r.t > ttl ? null : r; } catch (e) { return null; } },
    clearData(){ try { const ix = idx(); Object.keys(ix).filter(k => k.indexOf(VIEW) !== 0).forEach(k => { rawDel('c:' + k); delete ix[k]; }); rawSet('i', JSON.stringify(ix)); } catch (e) {} }   // salinan data pasien dibuang saat logout; antrean TIDAK dibuang
  };
})();

/* antrean laporan offline (Input Data) */
const Q = {
  all(){ try { const a = JSON.parse(OFF.get('q') || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
  save(a){
    const done = a.filter(x => x.st === 'done').slice(-5);
    return OFF.set('q', JSON.stringify(a.filter(x => x.st !== 'done').concat(done)));
  },
  pending(){ return Q.all().filter(x => x.st === 'pending'); },
  add(fn, args){
    const a = Q.all(), it = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), fn: fn, args: args, ts: Date.now(), by: ($('un') || {}).textContent || '', st: 'pending' };
    a.push(it); return { it: it, persisted: Q.save(a) };
  },
  patch(id, o){ const a = Q.all(), it = a.find(x => x.id === id); if (it) { Object.assign(it, o); Q.save(a); } },
  del(id){ Q.save(Q.all().filter(x => x.id !== id)); }
};
const OFFQ = {
  fns: {},
  list: () => Q.all(),
  pending: () => Q.pending().length,
  send: () => syncQueue(true),
  remove(id){ Q.del(id); this.emit(); updateBanner(); },
  take(id){ const it = Q.all().find(x => x.id === id) || null; if (it) { Q.del(id); this.emit(); updateBanner(); } return it; },
  on(k, f){ this.fns[k] = f; },
  emit(){ Object.keys(this.fns).forEach(k => { try { this.fns[k](); } catch (e) {} }); }
};

function offline(){ return !navigator.onLine || ST.fail; }
function fmtT(t){ try { return new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function updateBanner(){
  const b = $('offb'); if (!b) return;
  const off = offline(), pend = Q.pending().length;
  if (!off && !pend) { b.hidden = true; return; }
  b.className = 'offb ' + (off ? 'off' : 'pend');
  b.innerHTML = off
    ? '<span>📴 <b>Mode offline.</b> Data yang tampil adalah salinan terakhir di perangkat. Input Data tetap bisa dipakai: laporan disimpan lalu dikirim otomatis saat online.' + (pend ? ' <b>' + pend + ' laporan menunggu.</b>' : '') + '</span>'
    : '<span>⏳ <b>' + pend + ' laporan offline</b> menunggu dikirim.</span><button class="btn sm" id="offSend" type="button">Kirim sekarang</button>';
  b.hidden = false;
}
function markFail(){ ST.fail = true; updateBanner(); }
function okNow(){ ST.fail = false; updateBanner(); }
function servedCache(h){
  updateBanner();
  if (Date.now() - ST.toastT > 30000) { ST.toastT = Date.now(); toast('Menampilkan salinan data tersimpan (' + fmtT(h.t) + ').'); }
}

async function secRead(fn, a){
  const cacheable = !(fn === 'getPasien' && a[0] && String(a[0].q || '').trim());     // hasil pencarian tidak disimpan
  const key = fn + '|' + JSON.stringify(a);
  if (!navigator.onLine) {
    const h = cacheable ? OFF.cGet(key) : null;
    if (h) { servedCache(h); return h.v; }
    throw new Error(MSG_NOCACHE);
  }
  try {
    const v = await apiT(cacheable && OFF.has(key) ? 25000 : 90000, fn, TOKEN, ...a);   // ada salinan: tunggu lebih singkat sebelum memakainya
    if (cacheable && v !== undefined && v !== null) OFF.cSet(key, v);
    okNow();
    return v;
  } catch (e) {
    if (!isNetErr(e)) throw e;
    markFail();
    const h = cacheable ? OFF.cGet(key) : null;
    if (h) { servedCache(h); return h.v; }
    throw new Error(MSG_NOCACHE);
  }
}
async function secWrite(fn, a){
  if (navigator.onLine) {
    try { const r = await api(fn, TOKEN, ...a); okNow(); return r; }
    catch (e) {
      if (/SESI_HABIS/.test(String((e && e.message) || ''))) {            // sesi habis: simpan dulu agar tidak hilang, kirim setelah login
        Q.add(fn, a); updateBanner();
        toast('Sesi berakhir. Laporan Anda disimpan di perangkat dan dikirim otomatis setelah login kembali.');
        throw e;
      }
      if (!isNetErr(e)) throw e;
      markFail();
    }
  }
  const q = Q.add(fn, a); updateBanner(); OFFQ.emit();
  return { queued: true, id: q.it.id, n: Q.pending().length, persisted: q.persisted && OFF.persist() };
}
function sec(fn, ...a){
  if (WRITE_Q[fn]) return secWrite(fn, a);
  if (READ_C[fn]) return secRead(fn, a);
  if (!navigator.onLine) return Promise.reject(new Error(MSG_NEEDNET));
  return api(fn, TOKEN, ...a).then(v => { okNow(); return v; }, e => { if (isNetErr(e)) markFail(); throw e; });
}

let syncing = false;
async function syncQueue(manual){
  if (syncing || !TOKEN) return;
  const pend = Q.pending();
  if (!pend.length) { if (manual) toast('Tidak ada laporan yang menunggu.'); return; }
  if (!navigator.onLine) { if (manual) toast(MSG_NEEDNET); return; }
  syncing = true; let sent = 0, bad = 0;
  try {
    for (const it of pend) {
      let r;
      try { r = await api(it.fn, TOKEN, ...it.args); }
      catch (e) {
        if (isNetErr(e)) { markFail(); break; }
        if (/SESI_HABIS/.test(String((e && e.message) || ''))) break;            // setelah login kembali, pengiriman dilanjutkan
        Q.patch(it.id, { st: 'error', msg: String((e && e.message) || e) }); bad++; continue;
      }
      okNow();
      const rs = (r && r.results) || [], bd = rs.filter(x => x.s !== 'ok');
      Q.patch(it.id, { st: 'done', done: Date.now(), args: null, sum: { ok: (r && r.ok) || 0, n: rs.length, lines: bd.slice(0, 6).map(x => x.t) } });   // teks laporan dibuang setelah terkirim
      sent++;
    }
  } finally { syncing = false; }
  OFFQ.emit(); updateBanner();
  if (sent || bad) toast(sent + ' laporan offline terkirim' + (bad ? ', ' + bad + ' perlu diperiksa di menu Input Data.' : '.'));
}
async function prefetch(){                         // siapkan salinan menu & data dasar selagi online
  if (!navigator.onLine || !TOKEN) return;
  try {
    for (const v of ['Dashboard', 'Input', 'Pasien', 'Register']) {
      const h = OFF.cGet('getView|' + JSON.stringify([v]));
      if (!h || Date.now() - h.t > 864e5) await secRead('getView', [v]);
    }
    await secRead('getMingguList', []); await secRead('getDesa', []); await secRead('getKalender', []);
  } catch (e) {}
}

function trimImg(uri){                           // pangkas ruang transparan agar kaki tepat di dasar gambar
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.naturalWidth, h = im.naturalHeight, cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0);
        const d = cx.getImageData(0, 0, w, h).data; let t = h, b = -1, l = w, r = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x += 2) if (d[(y * w + x) * 4 + 3] > 24) { if (y < t) t = y; if (y > b) b = y; if (x < l) l = x; if (x > r) r = x; }
        if (b < 0) return ok(uri);
        const o = document.createElement('canvas'); o.width = r - l + 1; o.height = b - t + 1;
        o.getContext('2d').drawImage(cv, l, t, o.width, o.height, 0, 0, o.width, o.height);
        ok(o.toDataURL('image/png'));
      } catch (e) { ok(uri); }
    };
    im.onerror = () => ok(uri); im.src = uri;
  });
}

function kalHtml(d){
  const rows = d.rows, bg = d.bg; let h = '<div class="tw"><table class="kt">';
  rows.forEach((r, i) => {
    const isWk = i === 8;
    h += '<tr' + (isWk ? ' class="wk"' : '') + '>';
    if (i === 0) {                                  // baris bulan: sel kosong = lanjutan bulan sebelumnya (colspan)
      h += '<th style="background:' + esc(bg[0][0]) + '">' + esc(r[0]) + '</th>';
      let j = 1; while (j < r.length) { let k = j + 1; while (k < r.length && String(r[k]).trim() === '') k++; h += '<th class="ms" colspan="' + (k - j) + '" style="background:' + esc(bg[0][j]) + '">' + esc(r[j]) + '</th>'; j = k; }
    } else {
      r.forEach((x, j) => { h += '<td style="background:' + esc(bg[i][j]) + '"' + (j > 0 && String(rows[0][j]).trim() !== '' ? ' class="ms"' : '') + '>' + esc(x) + '</td>'; });
    }
    h += '</tr>';
  });
  return h + '</table></div>';
}

async function go(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.v === name));
  $('main').classList.toggle('wide', name === 'home');   // HOME memakai lebar penuh agar tidak ada ruang kosong
  if (name === 'home') { $('v_home').classList.add('on'); rainReset(); return; }
  let p = $('v_' + name);
  if (!p) { p = document.createElement('section'); p.id = 'v_' + name; p.className = 'view'; p.innerHTML = '<div class="ld">Memuat menu…</div>'; $('main').appendChild(p); }
  p.classList.add('on');
  if (!p.dataset.ok) {
    try {
      p.innerHTML = await sec('getView', name);
      p.querySelectorAll('script').forEach(o => { const s = document.createElement('script'); s.text = o.textContent; o.replaceWith(s); });
      p.dataset.ok = 1;
    } catch (e) { p.innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; return; }
  }
  if (Views[name] && Views[name].show) Views[name].show();
}
</script>
</body></html>
